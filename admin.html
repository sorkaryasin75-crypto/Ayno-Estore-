<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayno Store Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body class="bg-slate-100 text-slate-800 min-h-screen"><div id="app" class="max-w-7xl mx-auto p-4 md:p-8"><div class="flex items-center justify-between mb-6"><div><h1 class="text-2xl font-extrabold">Ayno Store Admin</h1><p id="admin-sub" class="text-sm text-slate-500">Secure management panel</p></div><button onclick="logout()" class="px-4 py-2 rounded-xl bg-slate-900 text-white">Logout</button></div><div id="error" class="hidden mb-4 p-3 rounded-xl bg-red-50 text-red-700"></div><div id="dash" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-6"></div><div class="bg-white rounded-2xl shadow-sm p-4"><div class="flex gap-2 flex-wrap mb-4"><button onclick="show('products')" class="tab">Products</button><button onclick="show('users')" class="tab">Users</button><button onclick="show('orders')" class="tab">Orders</button><button onclick="show('withdrawals')" class="tab">Withdrawals</button><button onclick="show('verifications')" class="tab">Verifications</button><button onclick="show('settings')" class="tab">Settings</button><button onclick="show('reviews')" class="tab">Reviews</button><button onclick="show('coupons')" class="tab">Coupons</button><button onclick="show('logs')" class="tab">Logs</button></div><div id="content"></div></div></div>
<script>
let token=localStorage.getItem('tg_token');let current='products';
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{'Authorization':'Bearer '+token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(path,opt);const d=await r.json().catch(()=>({success:false,error:'Invalid server response'}));if(!r.ok||d.success===false)throw new Error(d.error||'Request failed');return d;}
function logout(){localStorage.removeItem('tg_token');location.href='/';}
async function boot(){try{const tg=window.Telegram?.WebApp;tg?.ready();if(tg?.initData){const r=await api('/api/auth/telegram',{method:'POST',body:{initData:tg.initData}});token=r.token;localStorage.setItem('tg_token',token)}if(!token)throw new Error('Open Admin from the Telegram account configured as an admin.');const m=await api('/api/admin/me');$('admin-sub').textContent='Signed in as '+(m.admin.username?'@'+m.admin.username:m.admin.firstName);await dashboard();show(current)}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}}
async function dashboard(){const d=await api('/api/admin/dashboard');const s=d.stats;$('dash').innerHTML=Object.entries(s).map(([k,v])=>`<div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs text-slate-500">${esc(k)}</div><div class="text-xl font-black">${v}</div></div>`).join('')}
function show(x){current=x;({products:products,users:users,orders:orders,withdrawals:withdrawals,verifications:verifications,settings:settings,reviews:reviews,coupons:coupons,logs:logs}[x]||products)()}
const btn=`class="px-3 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold"`;
async function products(){const d=await api('/api/admin/products');$('content').innerHTML=`<div class="flex justify-between mb-3"><h2 class="font-bold">Products</h2><button ${btn} onclick="addProduct()">Add Product</button></div><div class="overflow-auto"><table class="w-full text-sm"><tr class="text-left border-b"><th class="p-2">Name</th><th>Category</th><th>Price</th><th>Visible</th><th></th></tr>${d.products.map(p=>`<tr class="border-b"><td class="p-2 flex items-center gap-2"><img src="${esc(p.logoUrl||'/assets/logos/ayno-store.svg')}" class="w-8 h-8 rounded-lg object-contain"><span>${esc(p.name)}</span></td><td>${esc(p.category)}</td><td>${p.price}</td><td>${p.isHidden?'Hidden':'Shown'}</td><td><button class="text-indigo-600" onclick='editProduct(${JSON.stringify(p)})'>Edit</button> <button class="text-red-600" onclick="delProduct('${esc(p.id)}')">Delete</button></td></tr>`).join('')}</table></div>`}
async function addProduct(){const name=prompt('Product name');if(!name)return;const price=Number(prompt('Price','0'));if(!Number.isFinite(price))return;const category=prompt('Category','app')||'app';await api('/api/admin/products',{method:'POST',body:{name,price,category,logoUrl:'/assets/logos/ayno-store.svg'}});await dashboard();products()}
async function editProduct(p){const name=prompt('Name',p.name);if(name===null)return;const price=Number(prompt('Price',p.price));if(!Number.isFinite(price))return;const logoUrl=prompt('Logo URL',p.logoUrl||'');const hidden=confirm('Hide this product?');await api('/api/admin/products/'+encodeURIComponent(p.id),{method:'PATCH',body:{name,price,logoUrl,isHidden:hidden}});await dashboard();products()}
async function delProduct(id){if(!confirm('Delete product?'))return;await api('/api/admin/products/'+encodeURIComponent(id),{method:'DELETE'});await dashboard();products()}
async function users(){const d=await api('/api/admin/users');$('content').innerHTML=`<h2 class="font-bold mb-3">Users</h2><div class="overflow-auto"><table class="w-full text-sm"><tr class="border-b text-left"><th class="p-2">User</th><th>Telegram ID</th><th>Balance</th><th>Role</th><th></th></tr>${d.users.map(u=>`<tr class="border-b"><td class="p-2">${esc(u.firstName)} ${esc(u.lastName)} <span class="text-slate-400">@${esc(u.username)}</span></td><td>${esc(u.tgId)}</td><td>${u.balance}</td><td>${u.role}</td><td><button class="text-indigo-600" onclick="editUser('${esc(u.tgId)}',${u.balance},'${esc(u.role)}')">Edit</button></td></tr>`).join('')}</table></div>`}
async function editUser(id,balance,role){const nb=Number(prompt('Balance',balance));if(!Number.isFinite(nb))return;const nr=prompt('Role: user/admin',role)||role;await api('/api/admin/users/'+encodeURIComponent(id),{method:'PATCH',body:{balance:nb,role:nr}});await dashboard();users()}
async function orders(){const d=await api('/api/admin/orders');$('content').innerHTML=`<h2 class="font-bold mb-3">Orders</h2>${d.orders.map(o=>`<div class="border rounded-xl p-3 mb-2"><div class="flex justify-between"><b>${esc(o.item)}</b><span>${esc(o.status)}</span></div><div class="text-xs text-slate-500">${esc(o.id)} · ${esc(o.userId)} · ${o.price}</div><div class="mt-2"><select onchange="orderStatus('${esc(o.id)}',this.value)" class="border rounded-lg p-2"><option>Pending</option><option>Processing</option><option>Approved</option><option>Completed</option><option>Delivered</option><option>Rejected</option><option>Cancelled</option></select></div></div>`).join('')}`}
async function orderStatus(id,status){await api('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',body:{status}});await dashboard();orders()}
async function withdrawals(){const d=await api('/api/admin/withdrawals');$('content').innerHTML=`<h2 class="font-bold mb-3">Withdrawals</h2>${d.withdrawals.map(w=>`<div class="border rounded-xl p-3 mb-2"><b>${w.amount}</b> · ${esc(w.method)} · ${esc(w.accountNumber)} · <b>${esc(w.status)}</b><div class="mt-2"><button class="text-green-600 mr-3" onclick="withdrawStatus('${esc(w.id)}','Approved')">Approve</button><button class="text-red-600" onclick="withdrawStatus('${esc(w.id)}','Rejected')">Reject</button></div></div>`).join('')}`}
async function withdrawStatus(id,status){await api('/api/admin/withdrawals/'+encodeURIComponent(id),{method:'PATCH',body:{status}});await dashboard();withdrawals()}
async function verifications(){const d=await api('/api/admin/verifications');$('content').innerHTML=`<h2 class="font-bold mb-3">Screenshot Verifications</h2>${d.verifications.map(v=>`<div class="border rounded-xl p-3 mb-2"><a class="text-indigo-600" target="_blank" href="${esc(v.path)}">${esc(v.originalName)}</a> · ${esc(v.status)}<div class="mt-2"><button class="text-green-600" onclick="verify('${esc(v.id)}','Approved')">Approve</button> <button class="text-red-600 ml-3" onclick="verify('${esc(v.id)}','Rejected')">Reject</button></div></div>`).join('')}`}
async function verify(id,status){let credit=0;if(status==='Approved')credit=Number(prompt('Credit amount','0'))||0;await api('/api/admin/verifications/'+encodeURIComponent(id),{method:'PATCH',body:{status,credit}});await dashboard();verifications()}
async function reviews(){const d=await api('/api/admin/reviews');$('content').innerHTML=`<h2 class=\"font-bold mb-3\">Reviews</h2>${d.reviews.map(r=>`<div class=\"border rounded-xl p-3 mb-2\"><b>${esc(r.productId)}</b> · ${r.rating}/5 · ${esc(r.userName)}<p class=\"text-sm text-slate-600\">${esc(r.comment)}</p><button class=\"text-red-600\" onclick=\"delReview('${esc(r.id)}')\">Delete</button></div>`).join('')}`}
async function delReview(id){if(!confirm('Delete review?'))return;await api('/api/admin/reviews/'+encodeURIComponent(id),{method:'DELETE'});reviews()}
async function coupons(){const d=await api('/api/admin/coupons');$('content').innerHTML=`<div class=\"flex justify-between mb-3\"><h2 class=\"font-bold\">Coupons</h2><button ${btn} onclick=\"addCoupon()\">Create Coupon</button></div>${d.coupons.map(c=>`<div class=\"border rounded-xl p-3 mb-2\"><b>${esc(c.code)}</b> · ${c.type} · ${c.value} · uses ${c.uses}/${c.maxUses||'∞'}</div>`).join('')}`}
async function addCoupon(){const code=prompt('Code (blank = auto)')||'';const value=Number(prompt('Value','5'))||0;const type=prompt('Type: fixed or percent','fixed')||'fixed';await api('/api/admin/coupons',{method:'POST',body:{code,value,type}});coupons()}
async function logs(){const d=await api('/api/admin/logs');$('content').innerHTML=`<h2 class=\"font-bold mb-3\">Client Error Logs</h2><pre class=\"text-xs whitespace-pre-wrap bg-slate-950 text-slate-100 p-4 rounded-xl overflow-auto\">${esc(JSON.stringify(d.logs,null,2))}</pre>`}
async function settings(){const d=await api('/api/admin/settings');const s=d.settings;$('content').innerHTML=`<h2 class="font-bold mb-4">Settings</h2><div class="grid md:grid-cols-2 gap-3"><label>Min Withdraw<input id="mw" type="number" value="${s.minWithdraw}" class="border p-2 rounded-xl w-full"></label><label>Min Add Balance<input id="ma" type="number" value="${s.minAddBalance}" class="border p-2 rounded-xl w-full"></label><label>VPN Coin Rate<input id="cv" type="number" value="${s.coinRateVpn}" class="border p-2 rounded-xl w-full"></label><label>Proxy Coin Rate<input id="cp" type="number" value="${s.coinRateProxy}" class="border p-2 rounded-xl w-full"></label><label>Mail Coin Rate<input id="cm" type="number" value="${s.coinRateMail}" class="border p-2 rounded-xl w-full"></label></div><button ${btn} class="mt-4" onclick="saveSettings()">Save Settings</button>`}
async function saveSettings(){await api('/api/admin/settings',{method:'PATCH',body:{minWithdraw:Number($('mw').value),minAddBalance:Number($('ma').value),coinRateVpn:Number($('cv').value),coinRateProxy:Number($('cp').value),coinRateMail:Number($('cm').value)}});alert('Saved');await dashboard()}
boot();
</script></body></html>
